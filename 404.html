<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f141a" media="(prefers-color-scheme: dark)">
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('theme'); } catch (e) { }
      if (theme !== 'dark' && theme !== 'light') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <title>PrismSelf - 页面未找到</title>
  <link rel="icon" href="/icon/favicon.svg?v=202611264" type="image/svg+xml">
  <style>
    :root {
      color-scheme: light;
      --bg: #fff;
      --fg: #000;
      --muted: #52606d;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #0f141a;
        --fg: #e7edf3;
        --muted: #a8b5c2;
      }
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0f141a;
      --fg: #e7edf3;
      --muted: #a8b5c2;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--fg);
      background: var(--bg);
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }
    .not-found {
      max-width: 720px;
      margin: 0 auto;
      padding: 40px 12px 48px clamp(24px, 10.8vw, 43px);
    }
    .not-found-code {
      margin: 0 0 20px;
      font-family: Arial, sans-serif;
      font-size: clamp(72px, 24vw, 96px);
      font-weight: 700;
      line-height: 1;
    }
    .not-found-title {
      margin: 0 0 12px;
      font-size: 28px;
      line-height: 1.2;
    }
    .not-found-message {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="not-found" aria-labelledby="not-found-title">
    <p class="not-found-code">404</p>
    <h1 class="not-found-title" id="not-found-title">页面未找到</h1>
    <p class="not-found-message">这个网址可能已失效，或页面已经移动。</p>
  </main>
  <script>
    (function () {
      var prefix = location.protocol === 'file:' ? './assets/' : '/assets/';
      var opencc = document.createElement('script');
      opencc.src = prefix + 'opencc.js?v=202611261';
      opencc.onload = function () {
        var lang = document.createElement('script');
        lang.src = prefix + 'language.js?v=202611264';
        document.body.appendChild(lang);
      };
      document.body.appendChild(opencc);
    })();
  </script>
</body>
</html>
