name: Lighten themed scrollbars

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/scrollbar-lighten.yml

permissions:
  contents: write

jobs:
  update-scrollbars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update shared scrollbar colors
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('assets/theme.css')
          text = path.read_text(encoding='utf-8')
          marker = '/* Shared themed scrollbars. */'
          if marker not in text:
              raise SystemExit('scrollbar marker not found')

          block = '''/* Shared themed scrollbars. */
          :root {
            --prism-scrollbar-source: var(
              --scale-accent,
              var(
                --guide-control-border-strong,
                var(
                  --analysis-accent,
                  var(
                    --bingo-accent,
                    var(
                      --glossary-accent,
                      var(--teal, var(--primary-color, var(--accent, #2f6f73)))
                    )
                  )
                )
              )
            );
            --prism-scrollbar-thumb: color-mix(in srgb, var(--prism-scrollbar-source) 38%, white);
            --prism-scrollbar-thumb-hover: color-mix(in srgb, var(--prism-scrollbar-source) 58%, white);
          }

          :root[data-theme="dark"] {
            --prism-scrollbar-source: var(
              --scale-accent,
              var(
                --guide-control-border-strong,
                var(
                  --analysis-accent,
                  var(
                    --bingo-dk-accent,
                    var(
                      --glossary-accent,
                      var(--teal, var(--primary-color, var(--accent, #5fd0a4)))
                    )
                  )
                )
              )
            );
          }

          * {
            scrollbar-width: thin;
            scrollbar-color: var(--prism-scrollbar-thumb) transparent;
          }

          *::-webkit-scrollbar {
            width: 10px !important;
            height: 10px !important;
          }

          *::-webkit-scrollbar-track,
          *::-webkit-scrollbar-corner {
            background: transparent !important;
          }

          *::-webkit-scrollbar-thumb {
            background: var(--prism-scrollbar-thumb) !important;
          }

          *::-webkit-scrollbar-thumb:hover {
            background: var(--prism-scrollbar-thumb-hover) !important;
          }
          '''

          path.write_text(text.split(marker, 1)[0].rstrip() + '\n\n' + block, encoding='utf-8')
          Path('.github/workflows/scrollbar-lighten.yml').unlink()
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "改用浅色滚动条"
          git push
