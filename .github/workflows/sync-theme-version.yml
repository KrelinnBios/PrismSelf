name: Sync theme asset version

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-theme-version.yml

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update HTML resource versions
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const { readFileSync, writeFileSync, unlinkSync } = require('node:fs');
          const { createHash } = require('node:crypto');

          const assets = [
            'assets/theme.css',
            'assets/theme.js',
            'Guides/guide-common.css'
          ];
          const hash = createHash('sha256');
          for (const asset of assets) {
            hash.update(asset);
            hash.update('\0');
            hash.update(readFileSync(asset));
            hash.update('\0');
          }
          const VERSION = hash.digest('hex').slice(0, 12);

          const files = execFileSync('git', ['ls-files', '*.html'], { encoding: 'utf8' })
            .trim()
            .split(/\r?\n/)
            .filter(Boolean);

          for (const file of files) {
            const before = readFileSync(file, 'utf8');
            let after = before;
            after = after.replace(/(href=["'])([^"']*theme\.css)(?:\?v=[^"']*)?(["'])/g, `$1$2?v=${VERSION}$3`);
            after = after.replace(/(src=["'])([^"']*theme\.js)(?:\?v=[^"']*)?(["'])/g, `$1$2?v=${VERSION}$3`);
            after = after.replace(/(href=["'])([^"']*guide-common\.css)(?:\?v=[^"']*)?(["'])/g, `$1$2?v=${VERSION}$3`);
            if (after !== before) writeFileSync(file, after);
          }

          unlinkSync('.github/workflows/sync-theme-version.yml');
          console.log(`theme version: ${VERSION}`);
          NODE

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: 更新资源缓存版本"
          git push
