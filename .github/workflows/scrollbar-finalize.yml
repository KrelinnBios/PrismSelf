name: Scrollbar Style Finalize

on:
  push:
    paths:
      - .scrollbar-finalize-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Finalize scrollbar rules and cache version
        shell: python
        run: |
          from pathlib import Path
          import re

          css_path = Path("assets/theme.css")
          css = css_path.read_text(encoding="utf-8")
          marker = "/* Shared themed scrollbars. */"
          start = css.index(marker)
          prefix = css[:start].rstrip()
          block = r'''

/* Shared themed scrollbars. */
:root {
  --prism-scrollbar-thumb: var(
    --scale-accent,
    var(
      --guide-control-border-strong,
      var(
        --analysis-accent,
        var(
          --bingo-accent,
          var(
            --glossary-accent,
            var(--teal, var(--primary-color, var(--accent, #2f6f73)))
          )
        )
      )
    )
  );
  --prism-scrollbar-thumb-hover: color-mix(in srgb, var(--prism-scrollbar-thumb) 82%, white);
  --prism-scrollbar-thumb-active: color-mix(in srgb, var(--prism-scrollbar-thumb) 82%, black);
}

:root[data-theme="dark"] {
  --prism-scrollbar-thumb: var(
    --scale-accent,
    var(
      --guide-control-border-strong,
      var(
        --analysis-accent,
        var(
          --bingo-dk-accent,
          var(
            --glossary-accent,
            var(--teal, var(--primary-color, var(--accent, #5fd0a4)))
          )
        )
      )
    )
  );
}

* {
  scrollbar-width: thin;
  scrollbar-color: var(--prism-scrollbar-thumb) transparent;
}

*::-webkit-scrollbar {
  width: 10px !important;
  height: 10px !important;
}

*::-webkit-scrollbar-track,
*::-webkit-scrollbar-corner {
  background: transparent !important;
}

*::-webkit-scrollbar-thumb {
  background: var(--prism-scrollbar-thumb) !important;
}

*::-webkit-scrollbar-thumb:hover {
  background: var(--prism-scrollbar-thumb-hover) !important;
}

*::-webkit-scrollbar-thumb:active {
  background: var(--prism-scrollbar-thumb-active) !important;
}
'''
          css_path.write_text(prefix + block + "\n", encoding="utf-8")

          version = "202609092"
          patterns = ("theme.css", "theme.js", "logo.svg", "guide-common.css")
          for path in Path(".").rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              updated = text
              for name in patterns:
                  updated = re.sub(rf'({re.escape(name)}\?v=)[^"\'\s>]+', rf'\g<1>{version}', updated)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          Path(".scrollbar-finalize-trigger").unlink(missing_ok=True)
          Path(".github/workflows/scrollbar-finalize.yml").unlink(missing_ok=True)
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "完善滚动条样式统一"
          git push
