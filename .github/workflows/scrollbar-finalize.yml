name: Scrollbar Style Finalize

on:
  push:
    paths:
      - .scrollbar-finalize-trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Finalize scrollbar rules and cache version
        shell: python
        run: |
          from pathlib import Path
          import re

          css_path = Path("assets/theme.css")
          css = css_path.read_text(encoding="utf-8")
          css = css.replace("width: 10px;\n  height: 10px;", "width: 10px !important;\n  height: 10px !important;")
          css = css.replace("background: transparent;\n}\n\n*::-webkit-scrollbar-thumb", "background: transparent !important;\n}\n\n*::-webkit-scrollbar-thumb")
          css = css.replace("background: var(--prism-scrollbar-thumb);\n}", "background: var(--prism-scrollbar-thumb) !important;\n}")
          css = css.replace("background: var(--prism-scrollbar-thumb-hover);\n}", "background: var(--prism-scrollbar-thumb-hover) !important;\n}")
          css = css.replace("background: var(--prism-scrollbar-thumb-active);\n}", "background: var(--prism-scrollbar-thumb-active) !important;\n}")
          css_path.write_text(css, encoding="utf-8")

          version = "202609092"
          patterns = ("theme.css", "theme.js", "logo.svg", "guide-common.css")
          for path in Path(".").rglob("*.html"):
              text = path.read_text(encoding="utf-8")
              updated = text
              for name in patterns:
                  updated = re.sub(rf'({re.escape(name)}\?v=)[^"\'\s>]+', rf'\g<1>{version}', updated)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          Path(".scrollbar-finalize-trigger").unlink(missing_ok=True)
          Path(".github/workflows/scrollbar-finalize.yml").unlink(missing_ok=True)
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "完善滚动条样式统一"
          git push
